  version: 2.1

  # WHY: This pipeline exercises SWO CI/CD Observability's CircleCI ContainerImage
  # path. The image build MUST push a manifest to a registry so that
  # `docker buildx build` produces a "containerimage.digest": "sha256:<64-hex>"
  # line — the exact pattern vcs-integration scans job logs for.

  jobs:
    build:
      docker:
        - image: cimg/base:current
      steps:
        - checkout
        - run:
            name: Build placeholder
            command: echo "build step ok"

    build-and-push-image:
      machine:
        image: ubuntu-2404:current
      steps:
        - checkout
        - run:
            name: Log in to Docker Hub
            command: echo "$DOCKERHUB_TOKEN" | docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin
        - run:
            name: Build and push image (emits containerimage.digest)
            command: |
              set -euo pipefail
              IMAGE="docker.io/${DOCKERHUB_USERNAME}/test-gh-app"
              TAG="cci-${CIRCLE_SHA1:0:7}"

              docker buildx create --use --name swo-builder >/dev/null 2>&1 || docker buildx use swo-builder

              docker buildx build \
                --push \
                --tag "${IMAGE}:${TAG}" \
                --tag "${IMAGE}:latest" \
                --metadata-file /tmp/build-metadata.json \
                .

              echo "===== buildx metadata (contains containerimage.digest) ====="
              cat /tmp/build-metadata.json

              # WHY: re-emit the digest in the precise quoted form the parser regex
              # matches, so the log scan is guaranteed a hit regardless of buildx JSON formatting.
              DIGEST=$(grep -o '"sha256:[a-f0-9]\{64\}"' /tmp/build-metadata.json | head -n1 | tr -d '"')
              echo "\"containerimage.digest\": \"${DIGEST}\""
              echo "Pushed ${IMAGE}:${TAG} @ ${DIGEST}"

  workflows:
    ci:
      jobs:
        - build
        - build-and-push-image:
            requires:
              - build
